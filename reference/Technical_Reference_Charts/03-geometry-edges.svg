<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Geometry ink: technical reference</title><desc id="desc">A blue object silhouette, a change in surface orientation, and a painted color stripe show which edges depth and reconstructed normals can detect.</desc>
<rect width="1200" height="680" fill="#111824"/><g font-family="sans-serif" fill="#eef3fa"><text x="54" y="64" font-size="31" font-weight="bold">03 / GEOMETRY EDGES</text><text x="54" y="99" font-size="17" fill="#a8b7ca">Technical schematic · depth and depth-derived normals</text>
<rect x="54" y="140" width="1092" height="390" rx="16" fill="#212b3c"/><path d="M180 422 L180 240 L420 198 L555 275 L555 422 Z" fill="#5084a5" stroke="#090d14" stroke-width="9" stroke-linejoin="round"/><path d="M420 198 L420 422" stroke="#111824" stroke-width="6"/><path d="M245 282 L357 263" stroke="#f3cb7c" stroke-width="15"/>
<path d="M600 236h78M600 332h78M600 424h78" stroke="#b3c9df" stroke-width="2"/><g font-size="19"><text x="704" y="242">Silhouette: depth change</text><text x="704" y="338">Crease: normal change</text><text x="704" y="430">Paint stripe: colour only</text></g>
<text x="54" y="593" font-size="20">Reconstructed normals describe visible depth shape, not normal-map details.</text><text x="54" y="631" font-size="16" fill="#a8b7ca">Transparent surfaces without depth writes and subpixel features remain limitations.</text></g></svg>
