<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Transparent compositing: technical reference</title><desc id="desc">A translucent blue layer partly covers an orange emitting background, illustrating source-over blending.</desc>
<rect width="1200" height="680" fill="#111824"/><g font-family="sans-serif" fill="#eef3fa"><text x="54" y="64" font-size="31" font-weight="bold">02 / TRANSPARENT LAYERS</text><text x="54" y="99" font-size="17" fill="#a8b7ca">Technical schematic · source-over compositing</text>
<rect x="54" y="140" width="690" height="390" rx="16" fill="#212b3c"/><rect x="112" y="218" width="560" height="235" fill="#eb8b3a"/><rect x="391" y="218" width="281" height="235" fill="#538dcc" opacity=".5"/><path d="M391 195v290" stroke="#d8eaff" stroke-width="2" stroke-dasharray="6 6"/>
<text x="153" y="500" font-size="19">Background</text><text x="418" y="500" font-size="19">Transparent layer</text>
<rect x="780" y="140" width="366" height="390" rx="16" fill="#212b3c"/><text x="810" y="192" font-size="20">Per-layer radiance</text><text x="810" y="237" font-size="17">C = Cfront × α</text><text x="840" y="268" font-size="17">+ Cback × (1 − α)</text><text x="810" y="335" font-size="18" fill="#a8b7ca">Depth, fog and DoF need</text><text x="810" y="365" font-size="18" fill="#a8b7ca">the right layer, not only</text><text x="810" y="395" font-size="18" fill="#a8b7ca">the opaque background.</text>
<text x="54" y="593" font-size="20">Selected bloom is alpha blended; atmospheric fog and DoF are not yet per-layer.</text><text x="54" y="631" font-size="16" fill="#a8b7ca">Use this as an architecture check, not a pixel-perfect target.</text></g></svg>
