name: tests

# GPU-free suite: dependencies are vendored; the separately licensed motion dataset is fetched for the full-library test.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gpu-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate all 77 separately licensed clips
        run: |
          bash tools/fetch_assets.sh --motion-only
          python3 tools/stage_lafan1.py --source "$HOME/.cache/lafan1" --dest "$RUNNER_TEMP/verified-motion"
      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-tests -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build-tests --output-on-failure

      - name: Generated files are current
        run: |
          python3 tools/gen_material_glsl.py
          python3 tools/gen_anime_luts.py
          python3 tools/gen_installer_art.py
          git diff --exit-code -- shaders/material_block.glsl assets/luts installer/art ||
            { echo "::error::regenerated files differ from the committed ones - rerun the generators and commit"; exit 1; }
