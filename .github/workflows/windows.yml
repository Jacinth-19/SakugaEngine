name: windows

# Builds the sandbox with MSVC on Windows, smoke-tests the executable, stages the install tree and packages it with
# Inno Setup (installer/sakuga.iss). The GPU-free test suite runs in the `tests` workflow on Linux; the Windows job is
# about producing something installable (its tests write to POSIX temp paths, and the runner has no Vulkan device).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from CMakeLists.txt
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(Sakuga VERSION ([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          "SAKUGA_VERSION=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Sakuga version: $ver"

      - name: Ensure the Vulkan SDK (loader import library)
        shell: pwsh
        run: |
          # The sandbox links the loader (vulkan-1.lib). The Windows images usually carry the SDK; when they do not, try
          # chocolatey and then LunarG's own installer. The step only fails if no import library can be found at all.
          function Find-VulkanLib {
            foreach ($p in @("$env:VULKAN_SDK\Lib\vulkan-1.lib", "C:\VulkanSDK\*\Lib\vulkan-1.lib",
                             "$env:ProgramFiles\VulkanSDK\*\Lib\vulkan-1.lib")) {
              $hit = Get-Item $p -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { return $hit.FullName }
            }
            return $null
          }

          $lib = Find-VulkanLib
          if ($lib) {
            Write-Host "Vulkan loader import library already on the image: $lib"
          } else {
            Write-Host "No Vulkan SDK found - installing it"
            choco install vulkan-sdk --no-progress -y
            $lib = Find-VulkanLib
            if (-not $lib) {
              $exe = Join-Path $env:RUNNER_TEMP "vulkan_sdk.exe"
              Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile $exe
              Start-Process -FilePath $exe -ArgumentList "/S" -Wait
              $lib = Find-VulkanLib
            }
          }
          if (-not $lib) { Write-Host "::error::vulkan-1.lib not found - cannot link the sandbox"; exit 1 }
          $sdk = Split-Path (Split-Path $lib -Parent) -Parent
          "VULKAN_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "VULKAN_SDK=$sdk"
          exit 0

      # The job log is not always reachable from outside, so a failure repeats the tail of the output as an annotation
      # (readable through the checks API).
      - name: Configure
        shell: pwsh
        run: |
          $log = cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSAKUGA_BUILD_TESTS=OFF 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host ("::error::configure failed:`n" + ($log -split "`r?`n" | Select-Object -Last 30 | Out-String))
            exit 1
          }

      - name: Build (Release)
        shell: pwsh
        run: |
          $log = cmake --build build --config Release --parallel 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host ("::error::build failed:`n" + ($log -split "`r?`n" | Select-Object -Last 30 | Out-String))
            exit 1
          }

      - name: Smoke test the executable
        shell: pwsh
        run: |
          # --help and --dump-ui-theme exit before any Vulkan device is created, so they run on a GPU-less runner.
          .\build\bin\Release\sandbox.exe --help | Select-Object -First 5
          .\build\bin\Release\sandbox.exe --dump-ui-theme theme_check.json
          if (-not (Test-Path theme_check.json)) { throw "the executable did not write theme_check.json" }
          Get-Content theme_check.json -TotalCount 3

      - name: Stage the install tree
        run: cmake --install build --config Release --prefix stage

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path stage\* -DestinationPath "Sakuga-Engine-$env:SAKUGA_VERSION-win64-portable.zip" -Force

      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y; $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1 }
          if (-not $iscc) { throw "ISCC.exe not found" }
          "ISCC=$($iscc.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Using $($iscc.FullName)"

      - name: Build the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $log = & $env:ISCC "/DAppVersion=$env:SAKUGA_VERSION" "/DSourceDir=$PWD\stage" "/DOutputDir=$PWD\dist" installer\sakuga.iss 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host ("::error::ISCC failed:`n" + ($log -split "`r?`n" | Select-Object -Last 25 | Out-String))
            exit 1
          }
          Get-ChildItem dist

      - name: Upload the installer and the portable zip
        uses: actions/upload-artifact@v4
        with:
          name: sakuga-windows-x64
          path: |
            dist/*.exe
            Sakuga-Engine-*-win64-portable.zip
          if-no-files-found: error
