name: Publish Windows preview

# Explicitly scoped, one-time update of the existing preview release. Ordinary
# pushes cannot publish; changing this workflow on the session branch can.
# Do not overwrite the original tag's assets: the newer build has a distinct SHA.
on:
  push:
    branches: [arena/a13c5e34-sakugaengine]
    paths: [.github/workflows/publish-windows-preview.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '42056888085'
      BUILD_SHA: 23ced193d1cb794cf6cd89e6da59a564cce79234
      RELEASE_TAG: v0.1.0-preview
    steps:
      - uses: actions/checkout@v4

      - name: Verify the source build
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          python3 - <<'PY'
          import json, os
          with open('run.json', encoding='utf-8') as f:
              run = json.load(f)
          assert run['head_sha'] == os.environ['BUILD_SHA'], 'unexpected build commit'
          assert run['head_branch'] == 'arena/a13c5e34-sakugaengine', 'unexpected source branch'
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'source build did not pass'
          assert run['path'] == '.github/workflows/windows.yml', 'unexpected workflow'
          PY
          gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease' | grep -Fx true

      - name: Download the verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: sakuga-windows-x64
          path: release-files
          github-token: ${{ github.token }}
          run-id: '42056888085'

      - name: Validate files and create checksums
        shell: bash
        run: |
          set -euo pipefail
          installer_path=$(find release-files -type f -name 'Sakuga-Engine-0.1.0-win64.exe' -print -quit)
          portable_path=$(find release-files -type f -name 'Sakuga-Engine-0.1.0-win64-portable.zip' -print -quit)
          test -s "$installer_path" && test -s "$portable_path" || { echo '::error::Expected Windows build files are missing.'; exit 1; }
          installer=Sakuga-Engine-0.1.0-win64-23ced19-setup.exe
          portable=Sakuga-Engine-0.1.0-win64-23ced19-portable.zip
          cp "$installer_path" "release-files/$installer"
          cp "$portable_path" "release-files/$portable"
          unzip -tq "release-files/$portable"
          python3 tools/verify_lafan1_archive.py "release-files/$portable"
          unzip -Z1 "release-files/$portable" > /tmp/sakuga-portable-files.txt
          grep -Fqx 'sandbox.exe' /tmp/sakuga-portable-files.txt
          grep -Eq '^shaders/.+\.spv$' /tmp/sakuga-portable-files.txt
          (cd release-files && sha256sum "$installer" "$portable" > SHA256SUMS-23ced19.txt)

      - name: Add new files and update release notes
        shell: bash
        run: |
          set -euo pipefail
          # Never clobber pre-existing files (including a previous partial attempt).
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > existing-assets.txt
          for file in Sakuga-Engine-0.1.0-win64-23ced19-setup.exe Sakuga-Engine-0.1.0-win64-23ced19-portable.zip SHA256SUMS-23ced19.txt; do
            if grep -Fxq "$file" existing-assets.txt; then
              echo "::error::Release asset $file already exists; refusing to replace it."; exit 1
            fi
          done
          gh release upload "$RELEASE_TAG" \
            release-files/Sakuga-Engine-0.1.0-win64-23ced19-setup.exe \
            release-files/Sakuga-Engine-0.1.0-win64-23ced19-portable.zip \
            release-files/SHA256SUMS-23ced19.txt
          gh release edit "$RELEASE_TAG" --notes-file .github/release-notes/windows-preview.md
